
plugins {
    id("com.facebook.react")
}

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
} else {
    logger.warn("Firebase Android config missing: add frontend/android/app/google-services.json from your real Firebase project to enable FCM.")
}

apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.coggsafe"

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.coggsafe"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            storeFile file(COGGSAFE_RELEASE_STORE_FILE)
            storePassword COGGSAFE_RELEASE_STORE_PASSWORD
            keyAlias COGGSAFE_RELEASE_KEY_ALIAS
            keyPassword COGGSAFE_RELEASE_KEY_PASSWORD
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.google.android.gms:play-services-location:21.3.0")
    implementation("com.facebook.react:react-android")

    // Google Play Services for Maps
    implementation 'com.google.android.gms:play-services-base:18.0.1'
    implementation 'com.google.android.gms:play-services-maps:18.0.2'

    def cameraxVersion = "1.4.2"
    implementation("androidx.camera:camera-core:${cameraxVersion}")
    implementation("androidx.camera:camera-camera2:${cameraxVersion}")
    implementation("androidx.camera:camera-lifecycle:${cameraxVersion}")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: "./vector-icons.gradle"

def patchReactNativeGraphicsConversions = {
    fileTree(gradle.gradleUserHomeDir).matching {
        include("**/react-android-0.87.0-release/prefab/modules/reactnative/include/react/renderer/core/graphicsConversions.h")
    }.files.each { header ->
        def contents = header.getText("UTF-8")
        def patchedContents = contents.replace(
                'return std::format("{}%", dimension.value);',
                'return folly::dynamic(std::to_string(dimension.value) + "%");'
        )
        if (contents != patchedContents) {
            header.setText(patchedContents, "UTF-8")
        }
    }
}

def patchReactNativeJsiPrefabHeader = {
    def source = file("../node_modules/react-native/ReactCommon/jsi/jsi/JSIDynamic.h")
    if (!source.exists()) {
        return
    }

    fileTree(gradle.gradleUserHomeDir).matching {
        include("**/react-android-0.87.0-release/prefab/modules/jsi/include/jsi/jsi.h")
    }.files.each { jsiHeader ->
        def destination = new File(jsiHeader.parentFile, "JSIDynamic.h")
        if (!destination.exists() || destination.getText("UTF-8") != source.getText("UTF-8")) {
            destination.setText(source.getText("UTF-8"), "UTF-8")
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("configureCMake") || task.name.startsWith("buildCMake")) {
        task.doFirst {
            patchReactNativeGraphicsConversions()
            patchReactNativeJsiPrefabHeader()
        }
    }
}
