
plugins {
    id("com.facebook.react")
}

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
} else {
    logger.warn("Firebase Android config missing: add frontend/android/app/google-services.json from your real Firebase project to enable FCM.")
}

apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.coggsafe"

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.coggsafe"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            def releaseStoreFile = project.findProperty('COGGSAFE_RELEASE_STORE_FILE') ?: System.getenv('COGGSAFE_RELEASE_STORE_FILE')
            def releaseStorePassword = project.findProperty('COGGSAFE_RELEASE_STORE_PASSWORD') ?: System.getenv('COGGSAFE_RELEASE_STORE_PASSWORD')
            def releaseKeyAlias = project.findProperty('COGGSAFE_RELEASE_KEY_ALIAS') ?: System.getenv('COGGSAFE_RELEASE_KEY_ALIAS')
            def releaseKeyPassword = project.findProperty('COGGSAFE_RELEASE_KEY_PASSWORD') ?: System.getenv('COGGSAFE_RELEASE_KEY_PASSWORD')
            if (!releaseStoreFile || !releaseStorePassword || !releaseKeyAlias || !releaseKeyPassword) {
                throw new GradleException('Release signing credentials are not configured. Set COGGSAFE_RELEASE_STORE_FILE, COGGSAFE_RELEASE_STORE_PASSWORD, COGGSAFE_RELEASE_KEY_ALIAS and COGGSAFE_RELEASE_KEY_PASSWORD in ~/.gradle/gradle.properties or CI secrets.')
            }
            storeFile file(releaseStoreFile)
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.google.android.gms:play-services-location:21.3.0")
    implementation("com.facebook.react:react-android")

    // Google Play Services for Maps
    implementation 'com.google.android.gms:play-services-base:18.0.1'
    implementation 'com.google.android.gms:play-services-maps:18.0.2'

    def cameraxVersion = "1.4.2"
    implementation("androidx.camera:camera-core:${cameraxVersion}")
    implementation("androidx.camera:camera-camera2:${cameraxVersion}")
    implementation("androidx.camera:camera-lifecycle:${cameraxVersion}")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: "./vector-icons.gradle"

// ROOT CAUSE FIX for:
//   Task :app:configureCMakeRelWithDebInfo[arm64-v8a]
//   java.io.FileNotFoundException: .../react-android-0.87.0-release/prefab/modules/reactnative/include/react/renderer/core/graphicsConversions.h
//
// This header is extracted by AGP's Prefab support from the react-android
// AAR into the Gradle transforms cache (under GRADLE_USER_HOME, which this
// project points at the project-local `android/.gradle-user-home` - see
// gradlew.bat / CI config). That extraction is a one-time, content-addressed
// Gradle *transform*: once the output directory for a given AAR exists,
// Gradle treats it as complete and will NEVER re-run the transform, even if
// the directory's contents are partial. A build that gets killed/OOM'd/
// interrupted (low disk, CI cancellation, IDE stop) while that transform is
// extracting the AAR's zip therefore leaves a permanently-corrupted,
// partially-extracted `.../react-android-0.87.0-release/prefab/...` folder
// behind - missing files like graphicsConversions.h - and every subsequent
// build fails with the exact FileNotFoundException above, no matter how
// many times it is retried, because Gradle keeps reusing the same broken
// cache entry. This is NOT a version mismatch, NOT a missing NDK/CMake
// dependency, and NOT something New Architecture/Prefab needs to be
// disabled for - it is a corrupted local transform cache entry.
//
// The pre-existing patch below assumed the header already exists and only
// rewrote its text (for the separate, unrelated std::format/NDK-C++20
// compatibility issue). It silently did nothing when the header was
// missing entirely, so CMake configuration went on to fail with the raw
// FileNotFoundException. This version makes that case self-healing: if the
// header cannot be found anywhere under GRADLE_USER_HOME, it deletes the
// corrupted `react-android-0.87.0-release` transform output(s) so Gradle
// is forced to re-run the AAR extraction transform from a clean state, and
// fails the current build with a clear, actionable message instead of the
// buried java.io.FileNotFoundException (the freshly-cleaned build must be
// re-invoked - a transform Gradle just invalidated cannot be re-resolved
// from inside an already-executing task in the same invocation).
def graphicsConversionsHeaderPattern = "**/react-android-0.87.0-release/prefab/modules/reactnative/include/react/renderer/core/graphicsConversions.h"

def patchReactNativeGraphicsConversions = {
    def matches = fileTree(gradle.gradleUserHomeDir).matching {
        include(graphicsConversionsHeaderPattern)
    }.files

    if (matches.isEmpty()) {
        // Header not found anywhere in the cache: either it has never been
        // extracted yet (fine - Prefab will extract it before this task
        // needs it) or an earlier extraction is corrupted/partial. Look for
        // any existing (necessarily incomplete) extraction of this AAR's
        // prefab package and remove just that cache subtree so Gradle
        // re-extracts it cleanly, rather than nuking the whole Gradle cache.
        def findAarRoot = { File f ->
            def dir = f
            while (dir != null && dir.name != "react-android-0.87.0-release") {
                dir = dir.parentFile
            }
            return dir
        }
        def corruptedTransformDirs = fileTree(gradle.gradleUserHomeDir).matching {
            include("**/react-android-0.87.0-release/prefab/**")
        }.files.collect(findAarRoot).findAll { it != null }.unique()

        if (!corruptedTransformDirs.isEmpty()) {
            corruptedTransformDirs.each { dir ->
                logger.error("[CoGGSafe] Removing corrupted/incomplete react-android-0.87.0-release prefab cache: ${dir}")
                delete(dir)
            }
            throw new GradleException(
                "The cached react-android-0.87.0-release Prefab package was incomplete " +
                "(missing graphicsConversions.h) and has now been deleted from " +
                "${corruptedTransformDirs[0].parentFile}. This was a corrupted Gradle " +
                "transform cache entry, most likely left behind by a previous build that " +
                "was interrupted (killed/out of disk/cancelled) while extracting the AAR. " +
                "Re-run the build now (do NOT delete the whole Gradle cache) - Gradle will " +
                "re-extract the package from scratch and this error will not recur."
            )
        }
        // No cached extraction exists at all yet - nothing to patch; Prefab
        // will extract it fresh before it's needed. Not an error.
        return
    }

    matches.each { header ->
        def contents = header.getText("UTF-8")
        def patchedContents = contents.replace(
                'return std::format("{}%", dimension.value);',
                'return folly::dynamic(std::to_string(dimension.value) + "%");'
        )
        if (contents != patchedContents) {
            header.setText(patchedContents, "UTF-8")
        }
    }
}

def patchReactNativeJsiPrefabHeader = {
    def source = file("../node_modules/react-native/ReactCommon/jsi/jsi/JSIDynamic.h")
    if (!source.exists()) {
        return
    }

    fileTree(gradle.gradleUserHomeDir).matching {
        include("**/react-android-0.87.0-release/prefab/modules/jsi/include/jsi/jsi.h")
    }.files.each { jsiHeader ->
        def destination = new File(jsiHeader.parentFile, "JSIDynamic.h")
        if (!destination.exists() || destination.getText("UTF-8") != source.getText("UTF-8")) {
            destination.setText(source.getText("UTF-8"), "UTF-8")
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("configureCMake") || task.name.startsWith("buildCMake")) {
        task.doFirst {
            patchReactNativeGraphicsConversions()
            patchReactNativeJsiPrefabHeader()
        }
    }
}
